[project]
name = "btp"
version = "0.1.0"
description = "Multimodal (vision + magnetometry + gravimetry) GPS-denied UAV localization with UDML fusion"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "timm>=1.0",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pyproj",
    "rasterio",
    "pyyaml",
    "tensorboard",
    "matplotlib",
]

[tool.setuptools]
packages = ["btp", "btp.models"]
