# Paths are relative to the repo root (~/BTP_impl on kratos).
raw_dir: data/raw
data_dir: data/processed
run_dir: runs

# Which modalities the model uses. Staged as in the midterm timeline:
#   [vision] -> [vision, mag] -> [vision, mag, grav]
modalities: [vision, mag, grav]
train_years: [2016, 2018, 2020]
test_year: 2022            # held-out imagery year (falls back to the first train year if missing)

grid_res: 25.0             # m, geophysics grid and sampling-cell size
img:
  res: 1.25                # m/px of the processed NAIP mosaics (20 px per grid cell)
  size: 224                # ViT input
  window: 320              # px read around the position before rotate/scale/crop
  scale_jitter: 0.15       # +-15 % footprint, i.e. altitude
  rot_jitter: 10.0         # degrees, heading error
seq:
  len: 64                  # samples in a sensor profile
  step: 25.0               # m between samples (64 x 25 m = 1.6 km of history)
  speed_jitter: 0.1
  turn_sigma_deg: 0.5      # random-walk heading wobble per step on synthetic tracks

# Sensor noise added to synthetic training profiles (physical units).
noise:
  mag: {sigma: 2.0, offset: 20.0, gain: 0.05}      # nT
  gD:  {sigma: 0.3, offset: 2.0,  gain: 0.05}      # mGal
  GDD: {sigma: 5.0, offset: 10.0, gain: 0.05}      # Eotvos
  height: {sigma: 3.0}                             # m

model:
  vit: vit_small_patch14_dinov2.lvd142m
  pretrained: true
  dim: 256                 # latent size of each (mu, Sigma)
  attn_heads: 4
  head: regress            # regress: lat/lon directly | classify: probabilities over map cells

# Coarse-to-fine pipeline (btp/c2f.py)
coarse:
  cell: 250.0              # m, classification cell size
  label_sigma: 0.5         # soft-label width in cells (neighbouring cells share credit)
  topk: 10                 # cells passed on to profile matching
tercom:
  margin: 125.0            # m searched beyond each candidate cell
  step: 25.0               # m search lattice
  headings: [-3, 0, 3]     # deg, compass error searched
  ins_drift: 0.01          # fraction of distance travelled, dead-reckoning error on the track
  temper: 4.0              # divides the profile log-likelihood (consecutive samples are correlated)
  hypotheses: 5            # distinct positions passed on to image matching
dsmac:
  ref_year: 2020           # onboard reference map (older than the test imagery)
  radius: 250.0            # m searched around each hypothesis
  rot_sigma: 8.0           # deg, heading error of the query image
  scale_sigma: 0.07        # altitude error of the query image
  tilt_deg: 10.0           # camera pitch/roll (perspective); the 'easy' runs set 0
  method: loftr            # ncc | loftr | lightglue  (see python -m btp.matchers)
  # Below this confidence the profile-matching estimate is kept
  # (ncc: peak-to-sidelobe ratio; loftr/lightglue: RANSAC inliers). Set from the val benchmark.
  min_score: {ncc: 6.0, loftr: 15, lightglue: 8}

track:                     # particle filter over held-out flights (btp/track.py)
  particles: 3000
  motion_sigma: 2.0        # m per step, added to the dead-reckoned displacement
  drift: 0.02              # fraction of step length, random dead-reckoning error
  dr_heading_bias_deg: 1.0 # per-flight systematic heading error of dead reckoning
  dr_scale_bias: 0.01      # per-flight systematic scale error
  geo_temper: 64.0         # consecutive windows share most samples, so each update is weak
  prior_weight: 0.05       # coarse-prior log-probability added per step
  reinject: 0.02           # fraction of particles re-drawn from the coarse prior per step
  image_every: 1
  image_radius_min: 60.0   # m
  image_sigma: 5.0         # m, image-fix likelihood width
  image_outlier: 0.02      # robust floor of the image likelihood
  image_seed: 0.1          # fraction of particles placed at a confident image fix
  gain_min: 0.25           # UDML gain K*w_k clipped to [gain_min, gain_max]
  gain_max: 2.0

retrieval:
  stride: 100.0            # m between reference-map tiles in the database
  hit_radius: 250.0        # m; a retrieved tile this close counts as a hit (and is not a negative)
  tau: 0.05                # similarity temperature for the cell prior
  dim: 256
  batch: 96
  epochs: 15
  steps_per_epoch: 400
  local_radius: 2000.0     # m; half the batches come from one neighbourhood (hard negatives)
  lr_vit: 2.0e-5
  lr: 1.0e-3

train:
  batch: 64
  epochs: 30
  samples_per_epoch: 50000
  lr_vit: 1.0e-4
  lr: 1.0e-3
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_steps: 1000
  workers: 16
  mod_dropout: 0.15        # per-modality drop probability (at least one is always kept)
  aux_weight: 0.3
  kl_beta: 1.0e-4
  val_stride: 4            # steps between validation windows on a held-out line
  seed: 0
